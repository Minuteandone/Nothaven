stages: [check, deploy]

syntax-and-tests:
  stage: check
  image: node:22
  script:
    - for f in $(find src -name '*.js'); do node --check "$f"; done
    - if ls tests/*.test.mjs >/dev/null 2>&1; then node --test tests/*.test.mjs; fi

pages-deploy:
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p public && cp -r index.html style.css src public/
    - npx --yes wrangler@3 pages project create stormhaven-rpg --production-branch=main || true
    - npx --yes wrangler@3 pages deploy public --project-name=stormhaven-rpg --branch=main
