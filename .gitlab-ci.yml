stages: [check, deploy]

syntax-and-tests:
  stage: check
  image: node:22
  script:
    - for f in $(find src -name '*.js'); do node --check "$f"; done
    - node --test $(ls tests/*.test.mjs tests/*.test.js 2>/dev/null)

browser-smoke:
  stage: check
  image: node:22-bookworm
  when: manual
  allow_failure: true
  timeout: 15m
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:browser
  after_script:
    - |
      mkdir -p browser-failure-artifacts
      for failure in browser-artifacts/*-failure.png; do
        [ -f "$failure" ] || continue
        width=${failure##*/}
        width=${width%%-*}
        for artifact in browser-artifacts/"$width"-*failure.png browser-artifacts/"$width"-*trace.zip; do
          [ ! -f "$artifact" ] || cp "$artifact" browser-failure-artifacts/
        done
      done
  artifacts:
    when: on_failure
    expire_in: 1 day
    paths:
      - browser-failure-artifacts/

pages-deploy:
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p public && cp -r index.html style.css src public/
    - npx --yes wrangler@3 pages project create stormhaven-rpg --production-branch=main || true
    - npx --yes wrangler@3 pages deploy public --project-name=stormhaven-rpg --branch=main
